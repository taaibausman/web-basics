	<meta charset="UTF-8">

	<!-- CSS -->
	<link rel="stylesheet" href="assets/css/style.css">
	<link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>

	<header class="header">
		<div class="container">
			<nav class="navbar">
				<a href="index.html" class="logo">Taaiba<span>.</span></a>

				<ul class="nav-links">
					<li><a href="index.html">Home</a></li>

				</ul>

				<div class="menu-btn">
					<i class="fa-solid fa-bars"></i>
				</div>
			</nav>
		</div>
	</header>

	<section class="hero">
		<div class="container text-center">
			<h1>Contact Me</h1>
			<p class="hero-description">Have a project or question? Send a message and I'll get back to you.</p>
		</div>
	</section>

	<section>
		<div class="container" style="max-width:720px;">

			<form id="contact-form" novalidate>

				<div class="form-group">
					<label for="name">Name</label>
					<input type="text" id="name" name="name" required placeholder="Your name">
					<small class="error" aria-live="polite"></small>
				</div>

				<div class="form-group">
					<label for="email">Email</label>
					<input type="email" id="email" name="email" required placeholder="you@example.com">
					<small class="error" aria-live="polite"></small>
				</div>

				<div class="form-group">
					<label for="message">Message</label>
					<textarea id="message" name="message" required placeholder="Write your message..."></textarea>
					<small class="error" aria-live="polite"></small>
				</div>

				<div class="form-group text-center">
					<button type="submit" class="btn primary-btn">Send Message</button>
				</div>

				<p id="form-success" class="text-center" style="display:none;color:var(--primary);font-weight:600;">Thanks! Your message looks good (no backend configured).</p>

			</form>

		</div>
	</section>

	<footer class="footer">
		<div class="container">
			<h3>Taaiba Usman</h3>
			<p>Frontend Developer • Data Science Student</p>
			<div class="social-icons">
				<a href="#"><i class="fab fa-github"></i></a>
				<a href="#"><i class="fab fa-linkedin"></i></a>
				<a href="#"><i class="fab fa-instagram"></i></a>
				<a href="#"><i class="fa-solid fa-envelope"></i></a>
			</div>
			<p class="copyright">© 2026 Taaiba Usman</p>
		</div>
	</footer>

	<script src="assets/js/main.js"></script>
	<script src="assets/js/contact.js"></script>

</body>
</html>
